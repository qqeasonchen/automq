# AutoMQ KRAFT S3 Working Configuration
# Based on the working kraft/server.properties format

############################# Server Basics #############################
node.id=1
process.roles=controller,broker
listeners=PLAINTEXT://:9092,CONTROLLER://:9093
controller.listener.names=CONTROLLER
controller.quorum.voters=1@localhost:9093
inter.broker.listener.name=PLAINTEXT
advertised.listeners=PLAINTEXT://localhost:9092

############################# Log Basics #############################
num.recovery.threads.per.data.dir=1
log.dirs=/tmp/kafka-s3-working-logs
auto.create.topics.enable=true

############################# S3 Configuration #############################
# Data buckets (true multi-replica configuration)
s3.data.buckets=0@s3://automq-multi-replica-primary?region=us-east-1&endpoint=http://localhost:9000&pathStyle=true&authType=static&accessKey=minioadmin&secretKey=minioadmin,1@s3://automq-multi-replica-primary?region=us-east-1&endpoint=http://localhost:9010&pathStyle=true&authType=static&accessKey=minioadmin&secretKey=minioadmin,2@s3://automq-multi-replica-primary?region=us-east-1&endpoint=http://localhost:9020&pathStyle=true&authType=static&accessKey=minioadmin&secretKey=minioadmin

# Ops buckets (true multi-replica configuration)
s3.ops.buckets=0@s3://automq-multi-replica-primary?region=us-east-1&endpoint=http://localhost:9000&pathStyle=true&authType=static&accessKey=minioadmin&secretKey=minioadmin,1@s3://automq-multi-replica-primary?region=us-east-1&endpoint=http://localhost:9010&pathStyle=true&authType=static&accessKey=minioadmin&secretKey=minioadmin,2@s3://automq-multi-replica-primary?region=us-east-1&endpoint=http://localhost:9020&pathStyle=true&authType=static&accessKey=minioadmin&secretKey=minioadmin

# WAL storage config (single bucket for WAL - WAL stays single replica for performance)
s3.wal.path=0@s3://automq-multi-replica-primary?region=us-east-1&endpoint=http://localhost:9000&pathStyle=true&authType=static&accessKey=minioadmin&secretKey=minioadmin

# WAL cache size (1MB for testing)
s3.wal.cache.size=1048576
# Block cache size (512MB) 
s3.block.cache.size=536870912

# Stream configuration (强制多副本 + 加速测试)
s3.stream.allocator.policy=POOLED_HEAP
s3.stream.set.object.compaction.interval=5
s3.stream.object.compaction.max.delay.ms=2000
s3.stream.force.quorum.all.objects=true
s3.stream.quorum.consistency.level=strong

# Enable ElasticStream (required for S3 storage)
elasticstream.enable=true

# Enable S3 Quorum for multi-replica (超强制全副本配置)
s3.stream.quorum.enabled=true
s3.stream.quorum.size=3
s3.stream.quorum.write.size=3
s3.stream.quorum.read.size=2
s3.stream.quorum.write.timeout.ms=30000
s3.stream.quorum.read.timeout.ms=10000
s3.stream.quorum.read.repair.enabled=true
s3.stream.quorum.read.repair.timeout.ms=5000
s3.stream.quorum.force.all.data=true
s3.stream.quorum.strict.mode=true
s3.stream.quorum.fail.on.partial.write=true

############################# Internal Topic Settings #############################
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
default.replication.factor=1
min.insync.replicas=1

############################# Group Coordinator Settings #############################
group.coordinator.rebalance.protocols=classic,consumer

############################# Log Retention Policy #############################
log.retention.hours=2
log.retention.bytes=2147483648
log.segment.bytes=1048576

############################# Socket Server Settings #############################
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
num.network.threads=4
num.io.threads=8
background.threads=12

############################# Additional Settings #############################
auto.leader.rebalance.enable=true
unclean.leader.election.enable=false
log.cleanup.policy=delete
log.cleaner.enable=true
allow.everyone.if.no.acl.found=true