# AutoMQ S3 Quorum Storage - Testing Configuration
# Optimized for automated testing and CI/CD
# Generated: 2025-08-20

# ===================================================================
# TESTING QUORUM CONFIGURATION
# ===================================================================

# Enable S3 Quorum Storage for testing
automq.s3.quorum.enabled=true

# Test setup with 3 replicas
automq.s3.quorum.size=3
automq.s3.quorum.write.quorum.size=2
automq.s3.quorum.read.quorum.size=1
automq.s3.quorum.write.timeout.ms=10000
automq.s3.quorum.read.timeout.ms=3000

# Read repair for testing consistency
automq.s3.quorum.read.repair.enabled=true
automq.s3.quorum.read.repair.timeout.ms=1000
automq.s3.quorum.consistency.check.enabled=true
automq.s3.quorum.consistency.check.interval.ms=30000

# ===================================================================
# TEST REPLICA CONFIGURATION
# ===================================================================

# Test replica 1 - Primary
automq.s3.quorum.replica.0.id=0
automq.s3.quorum.replica.0.region=us-west-2
automq.s3.quorum.replica.0.bucket=automq-test-primary
automq.s3.quorum.replica.0.endpoint=https://s3.us-west-2.amazonaws.com
automq.s3.quorum.replica.0.role=PRIMARY
automq.s3.quorum.replica.0.priority=100

# Test replica 2 - Secondary
automq.s3.quorum.replica.1.id=1
automq.s3.quorum.replica.1.region=us-west-2
automq.s3.quorum.replica.1.bucket=automq-test-secondary-1
automq.s3.quorum.replica.1.endpoint=https://s3.us-west-2.amazonaws.com
automq.s3.quorum.replica.1.role=SECONDARY
automq.s3.quorum.replica.1.priority=50

# Test replica 3 - Secondary
automq.s3.quorum.replica.2.id=2
automq.s3.quorum.replica.2.region=us-west-2
automq.s3.quorum.replica.2.bucket=automq-test-secondary-2
automq.s3.quorum.replica.2.endpoint=https://s3.us-west-2.amazonaws.com
automq.s3.quorum.replica.2.role=SECONDARY
automq.s3.quorum.replica.2.priority=25

# ===================================================================
# TESTING HEALTH CHECKS AND MONITORING
# ===================================================================

# Aggressive health checks for testing
automq.s3.quorum.health.check.enabled=true
automq.s3.quorum.health.check.interval.ms=10000
automq.s3.quorum.health.check.timeout.ms=3000
automq.s3.quorum.health.check.failure.threshold=2
automq.s3.quorum.health.check.recovery.threshold=1

# Detailed metrics for testing
automq.s3.quorum.metrics.enabled=true
automq.s3.quorum.metrics.collection.interval.ms=5000
automq.s3.quorum.metrics.export.enabled=true
automq.s3.quorum.metrics.export.interval.ms=10000

# Low thresholds for testing alerts
automq.s3.quorum.alert.latency.threshold.ms=2000
automq.s3.quorum.alert.error.rate.threshold=0.01
automq.s3.quorum.alert.availability.threshold=0.98

# ===================================================================
# TESTING FAILOVER AND RECOVERY
# ===================================================================

# Fast failover for testing
automq.s3.quorum.failover.enabled=true
automq.s3.quorum.failover.detection.timeout.ms=15000
automq.s3.quorum.failover.switch.timeout.ms=10000
automq.s3.quorum.failover.retry.max.attempts=2
automq.s3.quorum.failover.retry.backoff.ms=1000

# Quick recovery for testing
automq.s3.quorum.recovery.enabled=true
automq.s3.quorum.recovery.parallel.streams=2
automq.s3.quorum.recovery.batch.size=100
automq.s3.quorum.recovery.timeout.ms=60000

# ===================================================================
# TESTING PERFORMANCE CONFIGURATION
# ===================================================================

# Small cache sizes for testing
automq.s3.quorum.write.cache.enabled=true
automq.s3.quorum.write.cache.size.mb=32
automq.s3.quorum.write.cache.ttl.ms=30000
automq.s3.quorum.write.cache.max.entries.per.stream=100

automq.s3.quorum.read.cache.enabled=true
automq.s3.quorum.read.cache.size.mb=64
automq.s3.quorum.read.cache.ttl.ms=60000
automq.s3.quorum.read.cache.prefetch.enabled=false

# Small batch operations for testing
automq.s3.quorum.batch.enabled=true
automq.s3.quorum.batch.max.size=10
automq.s3.quorum.batch.timeout.ms=25
automq.s3.quorum.batch.concurrent.max=2

# ===================================================================
# TESTING S3 CONFIGURATION
# ===================================================================

# Small WAL settings
automq.s3.wal.cache.size=32MB
automq.s3.wal.upload.threshold=16MB
automq.s3.wal.upload.interval.ms=1000
automq.s3.wal.upload.concurrency=2

# Small object settings
automq.s3.stream.split.size=4MB
automq.s3.object.block.size=256KB
automq.s3.object.part.size=4MB
automq.s3.block.cache.size=32MB

# Frequent compaction for testing
automq.s3.stream.object.compaction.interval.minutes=2
automq.s3.stream.object.compaction.max.size.bytes=512MB
automq.s3.stream.set.object.compaction.interval=1
automq.s3.stream.set.object.compaction.cache.size=64MB
automq.s3.stream.set.object.compaction.upload.concurrency=4

# Network settings for testing
automq.s3.controller.request.retry.max.count=2
automq.s3.controller.request.retry.base.delay.ms=100
automq.s3.network.baseline.bandwidth=50MB
automq.s3.refill.period.ms=20

# Short retention for testing
automq.s3.object.retention.time.seconds=600
automq.s3.cleanup.enabled=true
automq.s3.cleanup.interval.ms=300000

# ===================================================================
# TESTING AND CHAOS ENGINEERING
# ===================================================================

# Enable all testing features
automq.s3.test.mode.enabled=true
automq.s3.test.chaos.engineering.enabled=true
automq.s3.test.fault.injection.enabled=true
automq.s3.test.latency.injection.enabled=true
automq.s3.test.network.partition.enabled=true

# Debug features for testing
automq.s3.debug.enabled=true
automq.s3.debug.request.logging=true
automq.s3.debug.performance.logging=true
automq.s3.debug.state.logging=true

# Test validation
automq.s3.test.data.validation.enabled=true
automq.s3.test.checksum.validation.enabled=true
automq.s3.test.consistency.validation.enabled=true

# ===================================================================
# MOCK AND SIMULATION SETTINGS
# ===================================================================

# Mock S3 endpoints for testing (uncomment if using mocks)
# automq.s3.mock.enabled=true
# automq.s3.mock.latency.min.ms=10
# automq.s3.mock.latency.max.ms=100
# automq.s3.mock.failure.rate=0.01

# Simulation settings
automq.s3.simulation.enabled=false
automq.s3.simulation.load.factor=1.0
automq.s3.simulation.chaos.factor=0.1

# ===================================================================
# CI/CD SPECIFIC SETTINGS
# ===================================================================

# Parallel test execution
automq.s3.test.parallel.enabled=true
automq.s3.test.parallel.threads=4
automq.s3.test.isolation.enabled=true

# Test timeouts
automq.s3.test.timeout.short.ms=5000
automq.s3.test.timeout.medium.ms=30000
automq.s3.test.timeout.long.ms=120000

# Resource cleanup
automq.s3.test.cleanup.enabled=true
automq.s3.test.cleanup.on.start=true
automq.s3.test.cleanup.on.finish=true

# ===================================================================
# ENVIRONMENT VARIABLES FOR TESTING
# ===================================================================
# Set these environment variables for testing:
#
# AWS_ACCESS_KEY_ID=test-access-key
# AWS_SECRET_ACCESS_KEY=test-secret-key
# AWS_REGION=us-west-2
# AUTOMQ_INSTANCE_ID=test-instance-001
# AUTOMQ_ENVIRONMENT=testing
# AUTOMQ_LOG_LEVEL=DEBUG
# AUTOMQ_TEST_BUCKET_PREFIX=automq-test-
# AUTOMQ_TEST_CLEANUP_ENABLED=true