#
# AutoMQ Complete Configuration - KRaft Mode with S3 Quorum Storage
# This configuration combines Kafka KRaft server settings with S3 Quorum Storage for production use
# Generated: 2025-08-20
#

############################# Server Basics #############################

# The role of this server. Setting this puts us in KRaft mode
process.roles=broker,controller

# The node id associated with this instance's roles
node.id=1

# The connect string for the controller quorum
controller.quorum.voters=1@localhost:9093

############################# Socket Server Settings #############################

# The address the socket server listens on.
# Combined nodes (i.e. those with `process.roles=broker,controller`) must list the controller listener here at a minimum.
# If the broker listener is not defined, the default listener will use a host name that is equal to the value of java.net.InetAddress.getCanonicalHostName(),
# with PLAINTEXT listener name, and port 9092.
#   FORMAT:
#     listeners = listener_name://host_name:port
#   EXAMPLE:
#     listeners = PLAINTEXT://your.host.name:9092
listeners=PLAINTEXT://:9092,CONTROLLER://:9093

# Name of listener used for communication between brokers.
inter.broker.listener.name=PLAINTEXT

# Listener name, hostname and port the broker or the controller will advertise to clients.
# If not set, it uses the value for "listeners".
advertised.listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093

# A comma-separated list of the names of the listeners used by the controller.
# If no explicit mapping set in `listener.security.protocol.map`, default will be using PLAINTEXT protocol
# This is required if running in KRaft mode.
controller.listener.names=CONTROLLER

# Maps listener names to security protocols, the default is for them to be the same. See the config documentation for more details
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_SSL:SASL_SSL

# The number of threads that the server uses for receiving requests from the network and sending responses to the network
num.network.threads=3

# The number of threads that the server uses for processing requests, which may include disk I/O
num.io.threads=8

# The send buffer (SO_SNDBUF) used by the socket server
socket.send.buffer.bytes=102400

# The receive buffer (SO_RCVBUF) used by the socket server
socket.receive.buffer.bytes=102400

# The maximum size of a request that the socket server will accept (protection against OOM)
socket.request.max.bytes=104857600

############################# Log Basics #############################

# A comma separated list of directories under which to store log files
log.dirs=/tmp/kraft-combined-logs

# The default number of log partitions per topic. More partitions allow greater
# parallelism for consumption, but this will also result in more files across
# the brokers.
num.partitions=1

# The number of threads per data directory to be used for log recovery at startup and flushing at shutdown.
# This value is recommended to be increased for installations with data dirs located in RAID array.
num.recovery.threads.per.data.dir=1

############################# Internal Topic Settings  #############################
# The replication factor for the group metadata internal topics "__consumer_offsets" and "__transaction_state"
# For anything other than development testing, a value greater than 1 is recommended to ensure availability such as 3.
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

############################# Log Retention Policy #############################

# The minimum age of a log file to be eligible for deletion due to age
log.retention.hours=168

# The maximum size of a log segment file. When this size is reached a new log segment will be created.
log.segment.bytes=1073741824

# The interval at which log segments are checked to see if they can be deleted according
# to the retention policies
log.retention.check.interval.ms=300000

############################# AutoMQ S3 Stream Settings #############################
# Whether to enable store data in elastic stream layer
elasticstream.enable=true

# ==================================================================
# S3 QUORUM STORAGE CONFIGURATION (PRODUCTION)
# ==================================================================

# Enable S3 Quorum Storage with enhanced reliability
automq.s3.quorum.enabled=true

# High-availability quorum configuration (5 replicas for better fault tolerance)
automq.s3.quorum.size=5
automq.s3.quorum.write.quorum.size=3
automq.s3.quorum.read.quorum.size=2
automq.s3.quorum.write.timeout.ms=25000
automq.s3.quorum.read.timeout.ms=8000

# Read repair and consistency
automq.s3.quorum.read.repair.enabled=true
automq.s3.quorum.read.repair.timeout.ms=3000
automq.s3.quorum.read.repair.concurrent.max=3
automq.s3.quorum.consistency.check.enabled=true
automq.s3.quorum.consistency.check.interval.ms=60000

# ==================================================================
# REPLICA CONFIGURATION - MULTI-REGION SETUP
# ==================================================================

# Primary replica - US East (Virginia)
automq.s3.quorum.replica.0.id=0
automq.s3.quorum.replica.0.region=us-east-1
automq.s3.quorum.replica.0.bucket=automq-prod-primary-us-east-1
automq.s3.quorum.replica.0.endpoint=https://s3.us-east-1.amazonaws.com
automq.s3.quorum.replica.0.role=PRIMARY
automq.s3.quorum.replica.0.priority=100

# Secondary replica 1 - US West (Oregon)
automq.s3.quorum.replica.1.id=1
automq.s3.quorum.replica.1.region=us-west-2
automq.s3.quorum.replica.1.bucket=automq-prod-backup-us-west-2
automq.s3.quorum.replica.1.endpoint=https://s3.us-west-2.amazonaws.com
automq.s3.quorum.replica.1.role=SECONDARY
automq.s3.quorum.replica.1.priority=80

# Secondary replica 2 - Europe (Ireland)
automq.s3.quorum.replica.2.id=2
automq.s3.quorum.replica.2.region=eu-west-1
automq.s3.quorum.replica.2.bucket=automq-prod-backup-eu-west-1
automq.s3.quorum.replica.2.endpoint=https://s3.eu-west-1.amazonaws.com
automq.s3.quorum.replica.2.role=SECONDARY
automq.s3.quorum.replica.2.priority=70

# Secondary replica 3 - Asia Pacific (Singapore)
automq.s3.quorum.replica.3.id=3
automq.s3.quorum.replica.3.region=ap-southeast-1
automq.s3.quorum.replica.3.bucket=automq-prod-backup-ap-southeast-1
automq.s3.quorum.replica.3.endpoint=https://s3.ap-southeast-1.amazonaws.com
automq.s3.quorum.replica.3.role=SECONDARY
automq.s3.quorum.replica.3.priority=60

# Secondary replica 4 - US Central (Ohio) 
automq.s3.quorum.replica.4.id=4
automq.s3.quorum.replica.4.region=us-east-2
automq.s3.quorum.replica.4.bucket=automq-prod-backup-us-east-2
automq.s3.quorum.replica.4.endpoint=https://s3.us-east-2.amazonaws.com
automq.s3.quorum.replica.4.role=SECONDARY
automq.s3.quorum.replica.4.priority=50

# ==================================================================
# S3 STORAGE BUCKET CONFIGURATION
# ==================================================================

# The data buckets (using quorum primary bucket as main data bucket)
# Full URL format: 0@s3://$bucket?region=$region[&endpoint=$endpoint][&pathStyle=$enablePathStyle][&authType=$authType][&accessKey=$accessKey][&secretKey=$secretKey][&checksumAlgorithm=$checksumAlgorithm]
# - pathStyle: true|false. The object storage access path style. When using MinIO, it should be set to true.
# - authType: instance|static.
#  - When set to instance, it will use instance profile to auth.
#  - When set to static, it will get accessKey and secretKey from the url or from system environment KAFKA_S3_ACCESS_KEY/KAFKA_S3_SECRET_KEY.
s3.data.buckets=0@s3://automq-prod-primary-us-east-1?region=us-east-1&authType=instance

# The ops buckets (for operational data)
s3.ops.buckets=0@s3://automq-prod-primary-us-east-1?region=us-east-1&authType=instance

# The WAL storage config (Write-Ahead Log)
s3.wal.path=0@s3://automq-prod-primary-us-east-1?region=us-east-1&authType=instance

# ==================================================================
# HEALTH CHECK AND MONITORING
# ==================================================================

# Health check configuration
automq.s3.quorum.health.check.enabled=true
automq.s3.quorum.health.check.interval.ms=30000
automq.s3.quorum.health.check.timeout.ms=10000
automq.s3.quorum.health.check.failure.threshold=3
automq.s3.quorum.health.check.recovery.threshold=2

# Performance monitoring
automq.s3.quorum.metrics.enabled=true
automq.s3.quorum.metrics.collection.interval.ms=15000
automq.s3.quorum.metrics.export.enabled=true
automq.s3.quorum.metrics.export.interval.ms=60000

# Alerting thresholds
automq.s3.quorum.alert.latency.threshold.ms=5000
automq.s3.quorum.alert.error.rate.threshold=0.05
automq.s3.quorum.alert.availability.threshold=0.95

# ==================================================================
# FAILOVER AND RECOVERY
# ==================================================================

# Automatic failover configuration
automq.s3.quorum.failover.enabled=true
automq.s3.quorum.failover.detection.timeout.ms=45000
automq.s3.quorum.failover.switch.timeout.ms=30000
automq.s3.quorum.failover.retry.max.attempts=3
automq.s3.quorum.failover.retry.backoff.ms=5000

# Recovery configuration
automq.s3.quorum.recovery.enabled=true
automq.s3.quorum.recovery.parallel.streams=4
automq.s3.quorum.recovery.batch.size=1000
automq.s3.quorum.recovery.timeout.ms=300000

# ==================================================================
# PERFORMANCE OPTIMIZATION
# ==================================================================

# Write cache optimization
automq.s3.quorum.write.cache.enabled=true
automq.s3.quorum.write.cache.size.mb=512
automq.s3.quorum.write.cache.ttl.ms=300000
automq.s3.quorum.write.cache.max.entries.per.stream=1000

# Read cache optimization  
automq.s3.quorum.read.cache.enabled=true
automq.s3.quorum.read.cache.size.mb=1024
automq.s3.quorum.read.cache.ttl.ms=600000
automq.s3.quorum.read.cache.prefetch.enabled=true

# Batch operations
automq.s3.quorum.batch.enabled=true
automq.s3.quorum.batch.max.size=100
automq.s3.quorum.batch.timeout.ms=50
automq.s3.quorum.batch.concurrent.max=8

# ==================================================================
# S3 STREAM PERFORMANCE SETTINGS
# ==================================================================

# WAL (Write-Ahead Log) settings
s3.wal.cache.size=536870912
s3.wal.upload.threshold=268435456
s3.wal.upload.interval.ms=500
s3.wal.upload.concurrency=4

# Stream and object settings
s3.stream.split.size=33554432
s3.object.block.size=2097152
s3.object.part.size=33554432
s3.block.cache.size=536870912

# Compaction settings
s3.stream.object.compaction.interval.minutes=30
s3.stream.object.compaction.max.size.bytes=21474836480
s3.stream.set.object.compaction.interval=5
s3.stream.set.object.compaction.cache.size=1073741824
s3.stream.set.object.compaction.upload.concurrency=16

# Network and retry settings
s3.controller.request.retry.max.count=5
s3.controller.request.retry.base.delay.ms=200
s3.network.baseline.bandwidth=1073741824
s3.refill.period.ms=5

# Data retention and cleanup
s3.object.retention.time.seconds=86400
s3.cleanup.enabled=true
s3.cleanup.interval.ms=3600000

# The S3 stream memory allocator policy, supported value: POOLED_HEAP, POOLED_DIRECT, default POOLED_HEAP
# Please note that when configured to use DIRECT memory, it is necessary to modify the heap size (e.g., -Xmx)
# and the direct memory size (e.g., -XX:MaxDirectMemorySize) in the vm options. You can set them through
# the environment variable KAFKA_HEAP_OPTS.
s3.stream.allocator.policy=POOLED_HEAP

# Disable Mock mode for production use
s3.mock.enable=false

# Enable S3 failover capabilities
s3.failover.enable=true

# Enable snapshot read functionality
s3.snapshot.read.enable=true

# ==================================================================
# SECURITY AND COMPLIANCE
# ==================================================================

# Encryption settings
automq.s3.encryption.enabled=true
automq.s3.encryption.type=SSE-S3
automq.s3.encryption.kms.key.id=alias/automq-s3-key

# Access control
automq.s3.access.control.enabled=true
automq.s3.access.logging.enabled=true
automq.s3.versioning.enabled=true

# ==================================================================
# ADVANCED FEATURES
# ==================================================================

# Tiered storage
automq.s3.tiered.storage.enabled=true
automq.s3.tiered.storage.hot.tier.size=1TB
automq.s3.tiered.storage.warm.tier.transition.days=7
automq.s3.tiered.storage.cold.tier.transition.days=30

# Cross-region replication monitoring
automq.s3.cross.region.monitoring.enabled=true
automq.s3.cross.region.monitoring.interval.ms=60000

# Snapshot and backup
automq.s3.snapshot.enabled=true
automq.s3.snapshot.interval.hours=6
automq.s3.snapshot.retention.days=30
automq.s3.backup.enabled=true
automq.s3.backup.schedule=0 2 * * *

############################# Settings for metrics #############################
# See kafka.automq.AutoMQConfig.S3_TELEMETRY_METRICS_EXPORTER_URI_DOC for the full format of the URI
s3.telemetry.metrics.exporter.uri=otlp://?endpoint=localhost:4317&protocol=grpc,prometheus://?host=127.0.0.1&port=9090

############################# Settings for Auto Balancer #############################
# The metric reporter to collect and report metrics for Auto Balancer
metric.reporters=kafka.autobalancer.metricsreporter.AutoBalancerMetricsReporter

############################# Settings of Controller for Auto Balancer #############################
# Whether to enabled Auto Balancer in controller, default false
autobalancer.controller.enable=true

# The topics to be excluded from balancing
#autobalancer.controller.exclude.topics=topic-a,topic-b,topic-c

# The broker ids to be excluded from balancing
#autobalancer.controller.exclude.broker.ids=0,1,2

# ==================================================================
# PRODUCTION OPTIMIZATIONS
# ==================================================================

# Debug settings (disabled in production)
automq.s3.debug.enabled=false
automq.s3.debug.request.logging=false
automq.s3.debug.performance.logging=false

# Testing settings (disabled in production)
automq.s3.test.mode.enabled=false
automq.s3.test.chaos.engineering.enabled=false

# ==================================================================
# ENVIRONMENT VARIABLES REFERENCE
# ==================================================================
# The following environment variables should be set for production:
#
# Required for AWS authentication:
# AWS_ACCESS_KEY_ID=your-production-access-key
# AWS_SECRET_ACCESS_KEY=your-production-secret-key
# AWS_SESSION_TOKEN=your-session-token (if using temporary credentials)
#
# Optional:
# AWS_REGION=us-east-1
# AWS_DEFAULT_REGION=us-east-1
# AUTOMQ_INSTANCE_ID=prod-instance-001
# AUTOMQ_ENVIRONMENT=production
# AUTOMQ_LOG_LEVEL=INFO
# KAFKA_HEAP_OPTS=-Xmx4g -Xms4g
# KAFKA_S3_ACCESS_KEY=your-s3-access-key
# KAFKA_S3_SECRET_KEY=your-s3-secret-key