# AutoMQ S3 Quorum Storage Configuration Example
# This configuration enables 3-replica quorum writes to S3

# Enable quorum storage (3 replicas)
automq.s3.quorum.enabled=true

# Quorum configuration
automq.s3.quorum.size=3
automq.s3.quorum.write.quorum.size=2
automq.s3.quorum.read.quorum.size=1
automq.s3.quorum.write.timeout.ms=30000
automq.s3.quorum.read.timeout.ms=10000
automq.s3.quorum.read.repair.enabled=true
automq.s3.quorum.read.repair.timeout.ms=5000

# Primary replica configuration (us-east-1)
automq.s3.quorum.replica.0.id=0
automq.s3.quorum.replica.0.region=us-east-1
automq.s3.quorum.replica.0.bucket=automq-data
automq.s3.quorum.replica.0.endpoint=10.65.172.124:9004
automq.s3.quorum.replica.0.role=PRIMARY
automq.s3.quorum.replica.0.priority=100

# Secondary replica 1 configuration (us-west-2)
automq.s3.quorum.replica.1.id=1
automq.s3.quorum.replica.1.region=us-west-2
automq.s3.quorum.replica.1.bucket=automq-data
automq.s3.quorum.replica.1.endpoint=10.65.172.124:9004
automq.s3.quorum.replica.1.role=SECONDARY
automq.s3.quorum.replica.1.priority=50

# Secondary replica 2 configuration (eu-west-1)
automq.s3.quorum.replica.2.id=2
automq.s3.quorum.replica.2.region=eu-west-1
automq.s3.quorum.replica.2.bucket=automq-data
automq.s3.quorum.replica.2.endpoint=10.65.172.124:9004
automq.s3.quorum.replica.2.role=SECONDARY
automq.s3.quorum.replica.2.priority=25

# AWS credentials (should be set via environment variables)
# AWS_ACCESS_KEY_ID=your-access-key
# AWS_SECRET_ACCESS_KEY=your-secret-key

# Base S3 configuration
automq.s3.wal.cache.size=200MB
automq.s3.wal.upload.threshold=100MB
automq.s3.wal.upload.interval.ms=1000
automq.s3.stream.split.size=16MB
automq.s3.object.block.size=1MB
automq.s3.object.part.size=16MB
automq.s3.block.cache.size=100MB
automq.s3.stream.object.compaction.interval.minutes=60
automq.s3.stream.object.compaction.max.size.bytes=10GB
automq.s3.controller.request.retry.max.count=3
automq.s3.controller.request.retry.base.delay.ms=500
automq.s3.stream.set.object.compaction.interval=10
automq.s3.stream.set.object.compaction.cache.size=200MB
automq.s3.stream.set.object.compaction.upload.concurrency=8
automq.s3.stream.set.object.compaction.stream.split.size=16MB
automq.s3.stream.set.object.compaction.force.split.period=120
automq.s3.stream.set.object.compaction.max.object.num=500
automq.s3.max.stream.num.per.stream.set.object=100000
automq.s3.max.stream.object.num.per.commit=10000
automq.s3.network.baseline.bandwidth=100MB
automq.s3.refill.period.ms=10
automq.s3.object.retention.time.seconds=600
automq.s3.failover.enable=false
automq.s3.snapshot.read.enable=false
