# Basic S3 Storage Configuration
# AutoMQ S3 Storage with MinIO Backend (No Quorum)

# Basic node configuration
node.id=1
controller.quorum.voters=1@localhost:9093

# Directory and log configuration
log.dirs=/tmp/automq-logs-basic
metadata.log.dir=/tmp/automq-metadata-basic

# Network configuration
listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
advertised.listeners=PLAINTEXT://localhost:9092
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

# Enable KRaft mode
process.roles=broker,controller

# Enable elastic stream for S3 storage
elasticstream.enable=true

# S3 data buckets configuration
s3.data.buckets=0@s3://automq-dev-primary?region=us-east-1&endpoint=http://localhost:9000&pathStyle=true&authType=static&accessKey=minioadmin&secretKey=minioadmin

# S3 ops buckets configuration
s3.ops.buckets=0@s3://automq-dev-primary?region=us-east-1&endpoint=http://localhost:9000&pathStyle=true&authType=static&accessKey=minioadmin&secretKey=minioadmin

# S3 WAL configuration
s3.wal.path=0@s3://automq-dev-primary?region=us-east-1&endpoint=http://localhost:9000&pathStyle=true&authType=static&accessKey=minioadmin&secretKey=minioadmin

# S3 Performance Configuration
s3.wal.capacity=1073741824
s3.wal.cache.size=268435456
s3.wal.upload.threshold=16777216
s3.stream.split.size=67108864
s3.object.part.size=16777216
s3.block.cache.size=134217728
s3.stream.cache.size=134217728

# Network bandwidth limits
s3.network.baseline.bandwidth=104857600
s3.inbound.bucket.bandwidth=104857600
s3.outbound.bucket.bandwidth=104857600

# Other essential settings
s3.refill.period.ms=100
s3.mock.enable=false
s3.force.path.style=true

# Logging configuration
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# AutoBalancer configuration (disabled for testing)
autobalancer.controller.enable=false

# Topics configuration
num.partitions=1
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# Stream reservation service
automq.stream.reservation.service.enabled=true