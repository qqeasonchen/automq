#
# AutoMQ Development Configuration - KRaft Mode with S3 Quorum Storage
# This configuration combines Kafka KRaft server settings with S3 Quorum Storage for development use
# Generated: 2025-08-20
#

############################# Server Basics #############################

# The role of this server. Setting this puts us in KRaft mode
process.roles=broker,controller

# The node id associated with this instance's roles
node.id=1

# The connect string for the controller quorum
controller.quorum.voters=1@localhost:9093

############################# Socket Server Settings #############################

# The address the socket server listens on.
listeners=PLAINTEXT://:9092,CONTROLLER://:9093

# Name of listener used for communication between brokers.
inter.broker.listener.name=PLAINTEXT

# Listener name, hostname and port the broker or the controller will advertise to clients.
advertised.listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093

# A comma-separated list of the names of the listeners used by the controller.
controller.listener.names=CONTROLLER

# Maps listener names to security protocols
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_SSL:SASL_SSL

# The number of threads that the server uses for receiving requests from the network and sending responses to the network
num.network.threads=3

# The number of threads that the server uses for processing requests, which may include disk I/O
num.io.threads=8

# The send buffer (SO_SNDBUF) used by the socket server
socket.send.buffer.bytes=102400

# The receive buffer (SO_RCVBUF) used by the socket server
socket.receive.buffer.bytes=102400

# The maximum size of a request that the socket server will accept (protection against OOM)
socket.request.max.bytes=104857600

############################# Log Basics #############################

# A comma separated list of directories under which to store log files
log.dirs=/tmp/kraft-combined-logs

# The default number of log partitions per topic.
num.partitions=1

# The number of threads per data directory to be used for log recovery at startup and flushing at shutdown.
num.recovery.threads.per.data.dir=1

############################# Internal Topic Settings  #############################
# The replication factor for the group metadata internal topics "__consumer_offsets" and "__transaction_state"
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

############################# Log Retention Policy #############################

# The minimum age of a log file to be eligible for deletion due to age
log.retention.hours=168

# The maximum size of a log segment file. When this size is reached a new log segment will be created.
log.segment.bytes=1073741824

# The interval at which log segments are checked to see if they can be deleted according to the retention policies
log.retention.check.interval.ms=300000

############################# AutoMQ S3 Stream Settings #############################
# Whether to enable store data in elastic stream layer
elasticstream.enable=true

# ==================================================================
# S3 QUORUM STORAGE CONFIGURATION (DEVELOPMENT)
# ==================================================================

# Enable S3 Quorum Storage for development
automq.s3.quorum.enabled=true

# Simple 3-replica setup for development
automq.s3.quorum.size=3
automq.s3.quorum.write.quorum.size=2
automq.s3.quorum.read.quorum.size=1
automq.s3.quorum.write.timeout.ms=15000
automq.s3.quorum.read.timeout.ms=5000

# Read repair (enabled for testing)
automq.s3.quorum.read.repair.enabled=true
automq.s3.quorum.read.repair.timeout.ms=2000

# Enable quorum at the stream level
s3.stream.quorum.enabled=true
s3.stream.quorum.size=3
s3.stream.quorum.write.size=2
s3.stream.quorum.read.size=1

# ==================================================================
# DEVELOPMENT REPLICA CONFIGURATION (Using MinIO)
# ==================================================================

# Dev replica 1 - Primary
automq.s3.quorum.replica.0.id=0
automq.s3.quorum.replica.0.region=us-west-2
automq.s3.quorum.replica.0.bucket=automq-dev-primary
automq.s3.quorum.replica.0.endpoint=http://localhost:9000
automq.s3.quorum.replica.0.role=PRIMARY
automq.s3.quorum.replica.0.priority=100

# Dev replica 2 - Secondary
automq.s3.quorum.replica.1.id=1
automq.s3.quorum.replica.1.region=us-west-2
automq.s3.quorum.replica.1.bucket=automq-dev-secondary-1
automq.s3.quorum.replica.1.endpoint=http://localhost:9000
automq.s3.quorum.replica.1.role=SECONDARY
automq.s3.quorum.replica.1.priority=50

# Dev replica 3 - Secondary  
automq.s3.quorum.replica.2.id=2
automq.s3.quorum.replica.2.region=us-west-2
automq.s3.quorum.replica.2.bucket=automq-dev-secondary-2
automq.s3.quorum.replica.2.endpoint=http://localhost:9000
automq.s3.quorum.replica.2.role=SECONDARY
automq.s3.quorum.replica.2.priority=25

# ==================================================================
# S3 STORAGE BUCKET CONFIGURATION (MinIO Development Setup)
# ==================================================================

# The data buckets (using multiple MinIO buckets for quorum testing)
s3.data.buckets=0@s3://automq-dev-primary?region=us-west-2&endpoint=http://localhost:9000&pathStyle=true&authType=static&accessKey=minioadmin&secretKey=minioadmin,1@s3://automq-dev-secondary-1?region=us-west-2&endpoint=http://localhost:9000&pathStyle=true&authType=static&accessKey=minioadmin&secretKey=minioadmin,2@s3://automq-dev-secondary-2?region=us-west-2&endpoint=http://localhost:9000&pathStyle=true&authType=static&accessKey=minioadmin&secretKey=minioadmin

# The ops buckets (for operational data)
s3.ops.buckets=0@s3://automq-dev-primary?region=us-west-2&endpoint=http://localhost:9000&pathStyle=true&authType=static&accessKey=minioadmin&secretKey=minioadmin

# The WAL storage config (Write-Ahead Log)
s3.wal.path=0@s3://automq-dev-primary?region=us-west-2&endpoint=http://localhost:9000&pathStyle=true&authType=static&accessKey=minioadmin&secretKey=minioadmin

# ==================================================================
# DEVELOPMENT MONITORING
# ==================================================================

# Health checks (relaxed for development)
automq.s3.quorum.health.check.enabled=true
automq.s3.quorum.health.check.interval.ms=60000
automq.s3.quorum.health.check.timeout.ms=5000
automq.s3.quorum.health.check.failure.threshold=5

# Metrics (enabled for development debugging)
automq.s3.quorum.metrics.enabled=true
automq.s3.quorum.metrics.collection.interval.ms=30000
automq.s3.quorum.metrics.export.enabled=false

# ==================================================================
# DEVELOPMENT PERFORMANCE SETTINGS
# ==================================================================

# Smaller cache sizes for development
automq.s3.quorum.write.cache.enabled=true
automq.s3.quorum.write.cache.size.mb=64
automq.s3.quorum.write.cache.ttl.ms=60000

automq.s3.quorum.read.cache.enabled=true
automq.s3.quorum.read.cache.size.mb=128
automq.s3.quorum.read.cache.ttl.ms=120000

# Batch operations (smaller batches)
automq.s3.quorum.batch.enabled=true
automq.s3.quorum.batch.max.size=20
automq.s3.quorum.batch.timeout.ms=100

# ==================================================================
# S3 STREAM PERFORMANCE SETTINGS (DEVELOPMENT)
# ==================================================================

# WAL settings (smaller for development)
s3.wal.cache.size=67108864
s3.wal.upload.threshold=33554432
s3.wal.upload.interval.ms=2000

# Object settings (smaller sizes)
s3.stream.split.size=8388608
s3.object.block.size=524288
s3.object.part.size=8388608
s3.block.cache.size=67108864

# Compaction (more frequent for testing)
s3.stream.object.compaction.interval.minutes=5
s3.stream.object.compaction.max.size.bytes=1073741824
s3.stream.set.object.compaction.interval=2
s3.stream.set.object.compaction.cache.size=134217728

# Network settings
s3.controller.request.retry.max.count=3
s3.controller.request.retry.base.delay.ms=500
s3.network.baseline.bandwidth=104857600
s3.refill.period.ms=10

# Shorter retention for development
s3.object.retention.time.seconds=3600

# Memory allocator
s3.stream.allocator.policy=POOLED_HEAP

# Enable mock mode for development (can be disabled for real MinIO testing)
s3.mock.enable=false

# Failover (disabled for stable development)
s3.failover.enable=false
s3.snapshot.read.enable=true

# ==================================================================
# DEVELOPMENT AND DEBUGGING FEATURES
# ==================================================================

# Enable debug features for development
automq.s3.debug.enabled=true
automq.s3.debug.request.logging=true
automq.s3.debug.performance.logging=true

# Testing features
automq.s3.test.mode.enabled=true
automq.s3.test.chaos.engineering.enabled=false

############################# Settings for metrics #############################
# See kafka.automq.AutoMQConfig.S3_TELEMETRY_METRICS_EXPORTER_URI_DOC for the full format of the URI
s3.telemetry.metrics.exporter.uri=prometheus://?host=127.0.0.1&port=9090

############################# Settings for Auto Balancer #############################
# The metric reporter to collect and report metrics for Auto Balancer
metric.reporters=kafka.autobalancer.metricsreporter.AutoBalancerMetricsReporter

############################# Settings of Controller for Auto Balancer #############################
# Whether to enabled Auto Balancer in controller, default false
autobalancer.controller.enable=false

# ==================================================================
